# Virtual Memory & zRAM tuning
vm.swappiness = 150
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
vm.vfs_cache_pressure = 50

# Smooth NVMe writeback for 32GB RAM (prevents 6.4GB dirty buffer I/O stalls)
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

# Eliminate background kcompactd memory defragmentation stutters
vm.compaction_proactiveness = 0
vm.page_lock_unfairness = 1

# Disable kernel debug lockup watchdog interrupts (saves power & CPU interrupts)
kernel.nmi_watchdog = 0

# Network stack latency, 16MB max socket buffer ceiling & Google BBR congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_mtu_probing = 1
