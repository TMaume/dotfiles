# Native Wayland & GPU / Zero-Copy Acceleration (Chromium 156 / Electron 45)
--ozone-platform=wayland
--enable-gpu-rasterization
--enable-zero-copy
--ignore-gpu-blocklist
--enable-native-gpu-memory-buffers
--enable-gpu-memory-buffer-video-frames
--enable-features=CanvasOopRasterization,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,AcceleratedVideoEncoder,WaylandPerSurfaceScale,ParallelDownloading,BackForwardCache

# Reduce background overhead & telemetry
--disable-background-networking
--disable-component-update
--no-pings

# V8 heap ceiling (reduces GC pauses on 32GB RAM)
--js-flags=--max-old-space-size=4096
