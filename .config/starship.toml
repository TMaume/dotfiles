"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#ffffff)\
$os\
[](bg:#e2e2e2 fg:#ffffff)\
$directory\
[](fg:#e2e2e2 bg:#2a2a2a)\
$git_branch\
$git_status\
[](fg:#2a2a2a bg:#201f1f)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#201f1f bg:#1c1b1b)\
$time\
[ ](fg:#1c1b1b)\
\n$character"""

[directory]
style = "fg:#464849 bg:#e2e2e2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#2a2a2a"
format = '[[ $symbol $branch ](fg:#ffffff bg:#2a2a2a)]($style)'

[git_status]
style = "bg:#2a2a2a"
format = '[[($all_status$ahead_behind )](fg:#ffffff bg:#2a2a2a)]($style)'

[nodejs]
symbol = ""
style = "bg:#201f1f"
format = '[[ $symbol ($version) ](fg:#c8c6c6 bg:#201f1f)]($style)'

[bun]
symbol = ""
style = "bg:#201f1f"
format = '[[ $symbol ($version) ](fg:#c8c6c6 bg:#201f1f)]($style)'

[rust]
symbol = ""
style = "bg:#201f1f"
format = '[[ $symbol ($version) ](fg:#c8c6c6 bg:#201f1f)]($style)'

[golang]
symbol = ""
style = "bg:#201f1f"
format = '[[ $symbol ($version) ](fg:#c8c6c6 bg:#201f1f)]($style)'

[php]
symbol = ""
style = "bg:#201f1f"
format = '[[ $symbol ($version) ](fg:#c8c6c6 bg:#201f1f)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1c1b1b"
format = '[[  $time ](fg:#c4c7c8 bg:#1c1b1b)]($style)'

[os]
style = "bg:#ffffff fg:#2f3131"
format = "[ $symbol ]($style)"
disabled = false

[character]
success_symbol = "[❯](#ffffff)"
error_symbol = "[❯](#ffb4ab)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
