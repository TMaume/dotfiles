"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#dfbfc4)\
$os\
[](bg:#a6898f fg:#dfbfc4)\
$directory\
[](fg:#a6898f bg:#2c2929)\
$git_branch\
$git_status\
[](fg:#2c2929 bg:#221f1f)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#221f1f bg:#1e1b1b)\
$time\
[ ](fg:#1e1b1b)\
\n$character"""

[directory]
style = "fg:#000000 bg:#a6898f"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#2c2929"
format = '[[ $symbol $branch ](fg:#dfbfc4 bg:#2c2929)]($style)'

[git_status]
style = "bg:#2c2929"
format = '[[($all_status$ahead_behind )](fg:#dfbfc4 bg:#2c2929)]($style)'

[nodejs]
symbol = ""
style = "bg:#221f1f"
format = '[[ $symbol ($version) ](fg:#d3c2c4 bg:#221f1f)]($style)'

[bun]
symbol = ""
style = "bg:#221f1f"
format = '[[ $symbol ($version) ](fg:#d3c2c4 bg:#221f1f)]($style)'

[rust]
symbol = ""
style = "bg:#221f1f"
format = '[[ $symbol ($version) ](fg:#d3c2c4 bg:#221f1f)]($style)'

[golang]
symbol = ""
style = "bg:#221f1f"
format = '[[ $symbol ($version) ](fg:#d3c2c4 bg:#221f1f)]($style)'

[php]
symbol = ""
style = "bg:#221f1f"
format = '[[ $symbol ($version) ](fg:#d3c2c4 bg:#221f1f)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1e1b1b"
format = '[[  $time ](fg:#d2c3c5 bg:#1e1b1b)]($style)'

[os]
style = "bg:#dfbfc4 fg:#402b2f"
format = "[ $symbol ]($style)"
disabled = false

[character]
success_symbol = "[❯](#dfbfc4)"
error_symbol = "[❯](#ffb4ab)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
