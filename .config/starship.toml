"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#ffb4a6)\
$os\
[](bg:#733429 fg:#ffb4a6)\
$directory\
[](fg:#733429 bg:#322826)\
$git_branch\
$git_status\
[](fg:#322826 bg:#271d1c)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#271d1c bg:#231918)\
$time\
[ ](fg:#231918)\
\n$character"""

[directory]
style = "fg:#ffdad4 bg:#733429"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#322826"
format = '[[ $symbol $branch ](fg:#ffb4a6 bg:#322826)]($style)'

[git_status]
style = "bg:#322826"
format = '[[($all_status$ahead_behind )](fg:#ffb4a6 bg:#322826)]($style)'

[nodejs]
symbol = ""
style = "bg:#271d1c"
format = '[[ $symbol ($version) ](fg:#e7bdb5 bg:#271d1c)]($style)'

[bun]
symbol = ""
style = "bg:#271d1c"
format = '[[ $symbol ($version) ](fg:#e7bdb5 bg:#271d1c)]($style)'

[rust]
symbol = ""
style = "bg:#271d1c"
format = '[[ $symbol ($version) ](fg:#e7bdb5 bg:#271d1c)]($style)'

[golang]
symbol = ""
style = "bg:#271d1c"
format = '[[ $symbol ($version) ](fg:#e7bdb5 bg:#271d1c)]($style)'

[php]
symbol = ""
style = "bg:#271d1c"
format = '[[ $symbol ($version) ](fg:#e7bdb5 bg:#271d1c)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#231918"
format = '[[  $time ](fg:#d8c2be bg:#231918)]($style)'

[os]
style = "bg:#ffb4a6 fg:#561e15"
format = "[ $symbol ]($style)"
disabled = false

[character]
success_symbol = "[❯](#ffb4a6)"
error_symbol = "[❯](#ffb4ab)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
